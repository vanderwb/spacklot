SPACKLOT_CLUSTER=$SPACKLOT_DEPLOYMENT_NAME
SPACKLOT_CLUSTER_VERSION=$SPACKLOT_DEPLOYMENT_DATE
SPACKLOT_TMPROOT=/tmp/spack/$SPACKLOT_CLUSTER
SPACKLOT_CORE_GCC=$SPACKLOT_SYSTEM_GCC
SPACKLOT_GPU_TYPE=none
SPACKLOT_USE_PREFERRED=false

if [[ $SPACKLOT_DEPLOYMENT_TYPE == production ]]; then
    SPACKLOT_ROOT_PUBLIC=$HOME/spack-tests/prod-test
else
    SPACKLOT_ROOT_PUBLIC=$HOME/spack-tests/test
fi

SPACKLOT_ROOT_DEPLOYMENT=$SPACKLOT_ROOT_PUBLIC/$SPACKLOT_CLUSTER_VERSION
SPACKLOT_ROOT_ENVS=$SPACKLOT_ROOT_DEPLOYMENT/envs
SPACKLOT_ROOT_PACKAGES_BUILTIN=$SPACKLOT_ROOT_DEPLOYMENT/packages/builtin
SPACKLOT_ROOT_BOOTSTRAP=$SPACKLOT_ROOT_DEPLOYMENT/bootstrap
SPACKLOT_BRANCH_SPACK=
SPACKLOT_BRANCH_PACKAGES_BUILTIN=
SPACKLOT_PYTHON_ROOT=
SPACKLOT_BUILD_HOSTS=

# Module tree customization
SPACKLOT_MODULE_ENVIRONMENT_NAME=hpc-stack
SPACKLOT_DEFAULT_MODULES=
# Order of hierarchical categories in "module avail" output [ascending (default), descending]
SPACKLOT_MODULE_ORDER=ascending

# Dependent variables
SPACKLOT_ENV_BUILD=$SPACKLOT_ROOT_ENVS/build
SPACKLOT_ENV_PUBLIC=$SPACKLOT_ROOT_ENVS/public
SPACKLOT_MIRROR_LOCAL=$SPACKLOT_ROOT_PUBLIC/mirror
SPACKLOT_ROOT_MODULES=$SPACKLOT_ROOT_PUBLIC/modules
SPACKLOT_ROOT_BASE=$SPACKLOT_ROOT_DEPLOYMENT/opt
