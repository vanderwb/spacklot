SPACKLOT_COLLECTION=default
SPACKLOT_DEFAULT_URL_SPACK=https://github.com/spack/spack.git
SPACKLOT_DEFAULT_URL_PACKAGES_BUILTIN=https://github.com/spack/spack-packages.git
SPACKLOT_PRODUCTION_USER=$USER
SPACKLOT_PRODUCTION_USER_NAME="$(getent passwd $USER | cut -d ':' -f 5 | cut -d ',' -f 1)"
SPACKLOT_PRODUCTION_USER_EMAIL=
SPACKLOT_KEY_DIRECTORY=/home/$SPACKLOT_PRODUCTION_USER/spack-keys
SPACKLOT_DEFAULT_BRANCH_SPACK= #develop
SPACKLOT_DEFAULT_BRANCH_PACKAGES_BUILTIN= #develop
